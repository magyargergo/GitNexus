name: Diagnose native proposal containment
on:
  push:
    branches: [ci/diagnose-eval-containment]
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: gitnexus/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.11.23
          python-version: '3.13'
      - working-directory: gitnexus
        run: npm ci && npm run build
      - run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends bubblewrap ripgrep socat
          mkdir -p "$RUNNER_TEMP/claude-canary"
          cp .github/claude-canary-runtime/package{,-lock}.json "$RUNNER_TEMP/claude-canary/"
          npm ci --prefix "$RUNNER_TEMP/claude-canary" --no-audit --no-fund
      - name: Exercise the paired proposal canary
        working-directory: eval
        env:
          GITNEXUS_REQUIRE_PROPOSAL_CANARY: '1'
          CLAUDE_CANARY_BIN: ${{ runner.temp }}/claude-canary/node_modules/@anthropic-ai/claude-code-linux-x64/claude
        run: |
          uv sync --locked --extra dev
          for trial in {1..16}; do
            echo "Trial $trial"
            pids=()
            for lane in 1 2 3; do
              .venv/bin/python -m pytest -p containment_probe -q -s --tb=short tests/test_proposal_evaluation.py::test_native_paired_proposal_cost_and_grading &
              pids+=("$!")
            done
            status=0
            for pid in "${pids[@]}"; do wait "$pid" || status=1; done
            if [[ $status != 0 ]]; then exit "$status"; fi
          done
